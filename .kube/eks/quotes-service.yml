apiVersion: apps/v1
kind: Deployment
metadata:
  name: quotes-service
  namespace: linqra
  labels:
    app: quotes-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quotes-service
  template:
    metadata:
      labels:
        app: quotes-service
    spec:
      containers:
        - name: quotes-service
          image: 945104357909.dkr.ecr.us-west-2.amazonaws.com/quotes-service:latest
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "ec2"
            - name: CLIENT_TRUST_STORE
              value: "/app/client-truststore.jks"
            - name: CLIENT_TRUST_STORE_PASSWORD
              value: "123456"
            - name: CLIENT_KEY_STORE
              value: "/app/client-keystore.jks"
            - name: CLIENT_KEY_STORE_PASSWORD
              value: "123456"
            - name: CLIENT_ALIAS_NAME
              value: "quotes-service-container"
            # Eureka config - use K8s service name
            - name: EUREKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: quotes-service-secrets
                  key: eureka-username
            - name: EUREKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quotes-service-secrets
                  key: eureka-password
            - name: EUREKA_INSTANCE_URL
              value: "quotes-service"  # K8s service name, matches cert CN!
            - name: GATEWAY_SERVICE_URL
              value: "api-gateway-service"
            # MongoDB - from Kubernetes secret
            - name: MONGO_DB_URI
              valueFrom:
                secretKeyRef:
                  name: quotes-service-secrets
                  key: mongo-uri
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /r/quotes-service/health
              port: 8083
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /r/quotes-service/health
              port: 8083
              scheme: HTTPS
            initialDelaySeconds: 60
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: quotes-service
  namespace: linqra
spec:
  selector:
    app: quotes-service
  ports:
    - protocol: TCP
      port: 8083
      targetPort: 8083
  type: ClusterIP